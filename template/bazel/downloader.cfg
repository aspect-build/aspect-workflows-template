# Bazel downloader config — wired up via `--downloader_config` in .bazelrc.
# Use it to route downloads through a private/mirror host or to add fallback
# mirrors for flaky upstreams. See
# https://aspect.build/blog/configuring-bazels-downloader and
# https://bazel.build/reference/command-line-reference#flag--downloader_config
#
# Examples:
#   # Send all github.com downloads through an internal mirror first.
#   rewrite github.com/(.*) my-mirror.internal/github/$1
#   # Add a fallback mirror for a flaky host.
#   rewrite ftp.gnu.org/(.*) https://ftpmirror.gnu.org/$1

# archive.ubuntu.com keeps only the current build of each package, so the
# zlib1g .deb rules_rs pins 404s once Ubuntu publishes the next build.
# snapshot.ubuntu.com keeps every build byte-identical, so the sha256 holds.
rewrite archive\.ubuntu\.com/ubuntu/pool/(.*) snapshot.ubuntu.com/ubuntu/20260901T000000Z/pool/$1
rewrite archive\.ubuntu\.com/ubuntu/pool/(.*) archive.ubuntu.com/ubuntu/pool/$1

# ape before 1.1.0 (here via bazel_env.bzl -> rules_coreutils) fetches its
# cosmos binaries from cosmo.zip alone, a single origin that goes down. The ape
# maintainers publish the same files to gitlab.arm.com, which ape 1.1.0 tries
# first, so the sha256 holds. Redundant once ape >= 1.1.0 resolves here.
rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/$1/$2
rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) cosmo.zip/pub/cosmos/v/$1/bin/$2
